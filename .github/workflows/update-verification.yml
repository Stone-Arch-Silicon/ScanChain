name: Notify Verification Repo

on:
  push:
    branches:
      - main

jobs:
  ping-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update in Verification
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.VERIFICATION_UPDATE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com \
            -d '{"event_type": "scanchain_updated"}'
